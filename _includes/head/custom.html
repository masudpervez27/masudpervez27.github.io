<!-- favicon: monogram mark -->

{% if page.math %}
<!-- Support Kramdown math output and single-dollar inline math in articles. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" integrity="sha256-Cm3tWrvOEzMWWN0jnzQ4Kr0GSSx0txth6MqoES7FX6U=" crossorigin="anonymous"></script>
{% endif %}

<!-- end custom head snippets -->
